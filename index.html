<title>촛불 편지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap">

<style>
:root{
  --line:#5E332E; --text:#7A4250; --text-2:#A8798A;
  --pink:#EF6D9C; --pink-d:#E1487C; --pink-l:#FBB8D0;
  --yellow:#FFD84D; --sky:#FBCEE0;
}
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  background:var(--sky); color:var(--text);
  font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  overflow:hidden; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent; word-break:keep-all;
}
#scene{ position:fixed; inset:0; display:block; z-index:0; touch-action:manipulation; }

.stage{
  position:fixed; inset:0; z-index:2;
  display:grid; place-items:center; padding:26px 22px; pointer-events:none;
}
.scene{
  grid-area:1/1; width:100%; max-width:560px;
  display:flex; flex-direction:column; align-items:center;
  opacity:0; visibility:hidden;
  transition:opacity 900ms ease, visibility 0s linear 900ms;
}
.scene[data-on="1"]{ opacity:1; visibility:visible; transition:opacity 1100ms ease, visibility 0s; }

/* 0. 로딩 */
.loading{ text-align:center; }
.hearts{ display:flex; gap:16px; }
.hearts i{
  width:28px; height:28px; display:block;
  animation:hop 1.05s ease-in-out infinite;
}
.hearts i:nth-child(2){ animation-delay:.16s; }
.hearts i:nth-child(3){ animation-delay:.32s; }
.hearts svg,.bar b svg{
  width:100%; height:100%; display:block;
  stroke:var(--line); stroke-width:2.6; stroke-linejoin:round; paint-order:stroke fill;
  filter:drop-shadow(0 2px 0 rgba(94,51,46,.16));
}
.hearts i:nth-child(1) svg{ fill:var(--pink); }
.hearts i:nth-child(2) svg{ fill:#fff; }
.hearts i:nth-child(3) svg{ fill:var(--yellow); }
@keyframes hop{ 0%,60%,100%{ transform:translateY(0) } 30%{ transform:translateY(-15px) } }

.loadtxt{ margin-top:26px; font-size:17px; color:var(--text); letter-spacing:.02em; }
.bar{
  position:relative; width:min(230px,62vw); height:16px; margin-top:18px;
  background:#fff; border:3px solid var(--line); border-radius:999px;
}
.bar span{
  display:block; height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg,var(--yellow),var(--pink));
  transition:width .22s ease;
}
.bar b{
  position:absolute; top:-12px; left:0; width:24px; height:24px;
  margin-left:-12px; transition:left .22s ease;
}
.bar b svg{ fill:var(--pink-d); }

.pct{ margin-top:14px; font-size:13px; color:var(--text-2); font-variant-numeric:tabular-nums; }

/* 1. 여는 화면 */
.opening{ text-align:center; pointer-events:auto; cursor:pointer; }
.opening .to{ margin-top:22vh; }
.to{
  font-size:clamp(30px,8vw,44px); color:#fff; text-wrap:balance;
  -webkit-text-stroke:5px var(--line); paint-order:stroke fill;
  filter:drop-shadow(0 4px 0 rgba(94,51,46,.18));
}
.lead{
  margin-top:24px; font-size:clamp(15px,4.1vw,18px);
  line-height:1.95; color:var(--text); max-width:26ch; text-wrap:balance;
}
.lead em{ font-style:normal; color:var(--pink-d); }
.note{ margin-top:12px; font-size:12.5px; line-height:1.8; color:var(--text-2); }
.tap{
  margin-top:30px; font-size:16px; color:#fff; font-family:"Jua",sans-serif;
  cursor:pointer;
  background:var(--pink); border:3px solid var(--line); border-radius:999px;
  padding:11px 30px; box-shadow:0 4px 0 var(--line);
  animation:bob 1.9s ease-in-out infinite;
}
@keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
.tap:active{ transform:translateY(4px); box-shadow:none; animation:none; }

/* 2. 케이크 */
.cake-scene{ justify-content:flex-end; height:100%; padding-bottom:5vh; }
.prompt{ text-align:center; transition:opacity 600ms ease; }
.prompt strong{
  display:block; font-size:22px; color:#fff;
  -webkit-text-stroke:4px var(--line); paint-order:stroke fill; margin-bottom:6px;
}
.prompt .sub{ font-size:13px; color:var(--text); }
.meter{
  width:136px; height:8px; margin:14px auto 0; background:rgba(255,255,255,.75);
  border:2.5px solid var(--line); border-radius:999px; overflow:hidden;
}
.meter i{
  display:block; height:100%; width:0%;
  background:linear-gradient(90deg,var(--yellow),var(--pink));
  transition:width 80ms linear;
}
.mic{
  display:flex; align-items:center; justify-content:center; gap:7px;
  margin-top:10px; min-height:15px; font-size:11.5px; color:var(--text-2);
}
.dot{
  width:8px; height:8px; border-radius:50%;
  background:#fff; border:2px solid var(--line); transition:background 350ms ease;
}
.dot[data-on="1"]{ background:var(--pink); }

/* 3. 편지 */
.letter{ text-align:center; }
.card{
  background:rgba(255,255,255,.94); border:4px solid var(--line);
  border-radius:26px; box-shadow:0 8px 0 rgba(94,51,46,.20);
  padding:32px 26px 26px; max-width:min(430px,92vw);
  opacity:0; transform:translateY(16px) scale(.97);
  animation:pop 900ms cubic-bezier(.22,1.2,.4,1) forwards;
}
@keyframes pop{ to{ opacity:1; transform:none; } }
.ribbon{
  display:inline-block; font-size:13px; color:#fff; background:var(--pink-d);
  border:3px solid var(--line); border-radius:999px; padding:5px 18px; margin-bottom:20px;
}
.letter p{
  font-family:"Gaegu","Jua",sans-serif; font-weight:700;
  font-size:clamp(20px,5.4vw,25px); line-height:1.72; color:var(--text);
  max-width:22ch; margin:0 auto .34em; text-wrap:balance;
  opacity:0; transform:translateY(8px); animation:rise 1.1s ease forwards;
}
@keyframes rise{ to{ opacity:1; transform:none; } }
.sign{
  margin-top:20px; font-family:"Gaegu","Jua",sans-serif; font-weight:700;
  font-size:17px; color:var(--pink-d); opacity:0; animation:rise 1.1s ease forwards;
}
.again{
  margin-top:26px; pointer-events:auto; font-family:"Jua",sans-serif;
  background:#fff; color:var(--pink-d); border:3px solid var(--line);
  border-radius:999px; font-size:13px; padding:9px 22px; cursor:pointer;
  box-shadow:0 3px 0 var(--line); opacity:0; animation:rise 1.1s ease 1.6s forwards;
}
.again:active{ transform:translateY(3px); box-shadow:none; }
:focus-visible{ outline:3px solid var(--pink-d); outline-offset:3px; border-radius:6px; }

@media (prefers-reduced-motion:reduce){
  .tap{ animation:none; }
  .hearts i{ animation:none; }
  .card,.letter p,.sign,.again{ opacity:1; transform:none; animation:none; }
}
</style>

<canvas id="scene"></canvas>

<div class="stage">
  <section class="scene loading" id="s0" data-on="1">
    <div class="hearts"><i><svg viewBox="0 0 24 24"><path d="M12 21.3 10.5 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.5L12 21.3z"/></svg></i><i><svg viewBox="0 0 24 24"><path d="M12 21.3 10.5 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.5L12 21.3z"/></svg></i><i><svg viewBox="0 0 24 24"><path d="M12 21.3 10.5 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.5L12 21.3z"/></svg></i></div>
    <p class="loadtxt">준비하는 중</p>
    <div class="bar"><span id="barFill"></span><b id="barBow"><svg viewBox="0 0 24 24"><path d="M12 21.3 10.5 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.5 11.5L12 21.3z"/></svg></b></div>
    <p class="pct" id="pct">0%</p>
  </section>

  <section class="scene opening" id="s1" role="button" tabindex="0" aria-label="시작하기">
    <h1 class="to" id="openTitle">누나, 생일 축하해</h1>
    <p class="lead">촛불은 <em>진짜로 불어서</em> 꺼야 해.<br>마이크는 <em>허용</em>을 눌러줘.</p>
    <p class="note">소리를 켜고 봐줘.<br>아이폰이면 무음 스위치도.</p>
    <button class="tap" id="startBtn" type="button">눌러서 시작</button>
  </section>

  <section class="scene cake-scene" id="s2" aria-live="polite">
    <div class="prompt" id="prompt">
      <strong id="promptMain">후— 하고 불어줘</strong>
      <span class="sub" id="sub">폰에 대고 천천히</span>
      <div class="meter"><i id="meterFill"></i></div>
      <div class="mic"><span class="dot" id="micDot" data-on="0"></span><span id="micNote"></span></div>
    </div>
  </section>

  <section class="scene letter" id="s3">
    <div class="card">
      <div class="ribbon" id="ribbon">To. 누나</div>
      <div id="letterBody"></div>
      <div class="sign" id="sign"></div>
    </div>
    <button class="again" id="again" type="button">다시 보기</button>
  </section>
</div>

<script>
/* ══════════════════════════════════════════
   여기만 고치면 됩니다
   ══════════════════════════════════════════ */
const CONFIG = {
  호칭: "누나",
  촛불개수: 3,

  감도: 1.0,        // 잘 안 꺼지면 1.3, 1.6으로 올리세요
  숨구분: 0.28,     // 노래에도 꺼지면 올리고(0.4), 불어도 안 꺼지면 내리세요(0.18)

  편지: [
    "누나, 오늘은 하루 종일",
    "좋은 일만 생겼으면 좋겠어.",
    "고맙다는 말은 쑥스러워서",
    "이렇게 만들어 봤어.",
    "생일 진짜 축하해!"
  ],
  서명: "— 하나뿐인 동생이",
  노래재생: true
};
/* ══════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const C = { line:'#5E332E', pink:'#EF6D9C', pinkD:'#E1487C', pinkL:'#FBB8D0',
            white:'#FFFFFF', yellow:'#FFD84D', blue:'#A9DDE9', straw:'#EE4A63', leaf:'#7FC48A' };

function hash(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function noise1(x){ const i=Math.floor(x),f=x-i,u=f*f*(3-2*f); return hash(i)*(1-u)+hash(i+1)*u; }
function fbm(x){ return noise1(x)*0.58+noise1(x*2.13+11.3)*0.29+noise1(x*4.37+27.7)*0.13; }
const rnd = () => Math.random();

const cv=$('scene'), ctx=cv.getContext('2d',{alpha:false});
let DPR=1,W=0,H=0,L=null;
let cakeSprite=null,cloudSprite=null,skyDay=null,skyDusk=null,garlandSprite=null,giftSprite=null;
let blobHot=null,blobMid=null,blobLow=null,sparkSprite=null,confSprites={};

function softBlob(size,stops){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  stops.forEach(([o,col])=>gr.addColorStop(o,col));
  g.fillStyle=gr; g.fillRect(0,0,size,size); return c;
}

function shapeSprite(kind,col,s){
  const c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d');
  g.fillStyle=col; g.strokeStyle='rgba(94,51,46,.45)'; g.lineWidth=Math.max(1,s*0.05);
  if(kind==='heart'){
    g.beginPath(); g.moveTo(s*.5,s*.86);
    g.bezierCurveTo(s*-.05,s*.52,s*.16,s*.10,s*.5,s*.30);
    g.bezierCurveTo(s*.84,s*.10,s*1.05,s*.52,s*.5,s*.86);
    g.closePath(); g.fill(); g.stroke();
  } else if(kind==='star'){
    g.beginPath();
    for(let i=0;i<10;i++){
      const a=-Math.PI/2+i*Math.PI/5, r=(i%2? s*.20 : s*.46);
      const x=s/2+Math.cos(a)*r, y=s/2+Math.sin(a)*r;
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.closePath(); g.fill(); g.stroke();
  } else {
    g.beginPath(); g.moveTo(s*.08,s*.5);
    g.quadraticCurveTo(s*.32,s*.14,s*.54,s*.5);
    g.quadraticCurveTo(s*.76,s*.86,s*.94,s*.5);
    g.lineWidth=Math.max(2,s*0.16); g.strokeStyle=col; g.stroke();
  }
  return c;
}

function buildSprites(){
  blobHot=softBlob(64,[[0,'rgba(255,253,238,1)'],[.35,'rgba(255,240,190,.75)'],[1,'rgba(255,225,150,0)']]);
  blobMid=softBlob(64,[[0,'rgba(255,201,96,.94)'],[.42,'rgba(255,158,52,.48)'],[1,'rgba(255,130,30,0)']]);
  blobLow=softBlob(64,[[0,'rgba(255,150,60,.42)'],[.45,'rgba(240,110,40,.18)'],[1,'rgba(230,90,30,0)']]);
  sparkSprite=softBlob(48,[[0,'rgba(255,255,255,.95)'],[.4,'rgba(255,216,77,.55)'],[1,'rgba(255,216,77,0)']]);
  const cols=[C.pink,C.pinkD,C.pinkL,C.white,C.yellow,C.blue];
  confSprites={cols};
  ['heart','star','ribbon'].forEach(k=>{ confSprites[k]=cols.map(col=>shapeSprite(k,col,34)); });
}

function skySprite(top,bot){
  const c=document.createElement('canvas');
  c.width=Math.ceil(W*DPR); c.height=Math.ceil(H*DPR);
  const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,top); gr.addColorStop(1,bot);
  g.fillStyle=gr; g.fillRect(0,0,W,H); return c;
}

function buildClouds(){
  const c=document.createElement('canvas');
  c.width=Math.ceil(W*DPR); c.height=Math.ceil(H*DPR);
  const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle='rgba(255,255,255,.55)';
  for(let i=0;i<9;i++){
    const cx=hash(i*3.1)*W, cy=hash(i*7.7)*H*0.72, s=44+hash(i*5.3)*70;
    g.beginPath();
    for(let k=0;k<5;k++){
      const a=k/5*Math.PI*2;
      g.ellipse(cx+Math.cos(a)*s*0.62, cy+Math.sin(a)*s*0.22, s*(0.55+hash(i*9+k)*0.4), s*0.44, 0,0,Math.PI*2);
    }
    g.fill();
  }
  return c;
}

function bandCanvas(y0,h){
  const c=document.createElement('canvas');
  c.width=Math.ceil(W*DPR); c.height=Math.ceil(h*DPR);
  const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0); g.translate(0,-y0);
  return {c,g,y0,h};
}

function bowShape(g,cx,cy,s,col){
  [-1,1].forEach(k=>{
    g.beginPath(); g.moveTo(cx,cy);
    g.bezierCurveTo(cx+k*s*1.55,cy-s*1.15, cx+k*s*2.05,cy+s*0.25, cx+k*s*1.00,cy+s*0.75);
    g.bezierCurveTo(cx+k*s*0.60,cy+s*0.95, cx+k*s*0.25,cy+s*0.45, cx,cy);
    g.closePath(); g.fillStyle=col; g.fill(); outline(g,3);
  });
  g.beginPath(); g.ellipse(cx,cy,s*0.44,s*0.40,0,0,Math.PI*2);
  g.fillStyle=col; g.fill(); outline(g,3);
}

function buildGarland(){
  const band=bandCanvas(0,120), c=band.c, g=band.g;
  const x0=-24, x1=W+24, y0=24, sag=52;
  const at=t=>{
    const mt=1-t;
    return [ mt*mt*x0 + 2*mt*t*(W/2) + t*t*x1,
             mt*mt*y0 + 2*mt*t*(y0+sag) + t*t*(y0-4) ];
  };
  g.beginPath();
  for(let i=0;i<=60;i++){ const[px,py]=at(i/60); i?g.lineTo(px,py):g.moveTo(px,py); }
  g.strokeStyle=C.line; g.lineWidth=4; g.lineCap='round'; g.stroke();
  const cols=[C.pink,'#FFFFFF',C.yellow,C.blue,C.pinkL];
  const n=Math.max(7,Math.round(W/58));
  for(let i=0;i<n;i++){
    const t=(i+0.5)/n, [px,py]=at(t);
    const fw=15, fh=34;
    g.beginPath();
    g.moveTo(px-fw,py); g.lineTo(px+fw,py); g.lineTo(px,py+fh);
    g.closePath();
    g.fillStyle=cols[i%cols.length]; g.fill(); outline(g,3.4);
  }
  return band;
}

function gift(g,x,baseY,w,h,body,rib){
  const y=baseY-h, lh=Math.max(18,h*0.24);
  g.beginPath(); g.roundRect(x-w/2,y,w,h,9); g.fillStyle=body; g.fill(); outline(g,4);
  g.fillStyle=rib; g.fillRect(x-w*0.09,y,w*0.18,h);
  g.beginPath(); g.moveTo(x-w*0.09,y); g.lineTo(x-w*0.09,y+h); outline(g,3);
  g.beginPath(); g.moveTo(x+w*0.09,y); g.lineTo(x+w*0.09,y+h); outline(g,3);
  g.beginPath(); g.roundRect(x-w/2-8,y-lh*0.5,w+16,lh,8); g.fillStyle=body; g.fill(); outline(g,4);
  g.fillStyle=rib; g.fillRect(x-w*0.09,y-lh*0.5+2,w*0.18,lh-4);
  bowShape(g,x,y-lh*0.5,Math.max(11,w*0.15),rib);
}

function buildGifts(){
  const band=bandCanvas(H-250,250), c=band.c, g=band.g;
  const base=H-14;
  gift(g, W*0.235, base, Math.min(112,W*0.27), 86,  C.pink,  '#FFFFFF');
  gift(g, W*0.775, base, Math.min(100,W*0.24), 104, C.blue,  C.yellow);
  gift(g, W*0.50,  base, Math.min(84, W*0.20), 62,  '#FFFFFF', C.pinkD);
  // 떠다니는 하트
  [[W*0.13,base-190,15],[W*0.88,base-215,13],[W*0.36,base-160,11]].forEach(([hx,hy,hs],i)=>{
    g.save(); g.translate(hx,hy); g.rotate((i-1)*0.3);
    g.beginPath();
    g.moveTo(0,hs*0.85);
    g.bezierCurveTo(-hs*1.15,hs*0.05,-hs*0.7,-hs*0.95,0,-hs*0.35);
    g.bezierCurveTo(hs*0.7,-hs*0.95,hs*1.15,hs*0.05,0,hs*0.85);
    g.closePath(); g.fillStyle=[C.pinkD,C.yellow,'#FFFFFF'][i]; g.fill(); outline(g,3);
    g.restore();
  });
  return band;
}

function buildLayout(){
  const cw=Math.max(200,Math.min(320,W*0.70));
  const rx=cw/2, ry=rx*0.20, cx=W/2;
  const topY=Math.min(H*0.585,H-215);
  const bodyH=Math.max(72,cw*0.33);
  const n=CONFIG.촛불개수;
  const spread=Math.min(cw*0.56,Math.max(1,n-1)*46);
  const cands=[];
  for(let i=0;i<n;i++){
    const t=n===1?0.5:i/(n-1), dx=(t-0.5)*spread;
    cands.push({x:cx+dx, base:topY+ry*0.28-Math.pow(dx/rx,2)*ry*0.28,
                h:46+Math.round(hash(i*3.7)*11), w:10});
  }
  L={cx,cw,rx,ry,topY,bodyH,cands};
}

function outline(g,w){ g.strokeStyle=C.line; g.lineWidth=w; g.lineJoin='round'; g.stroke(); }

function buildCake(){
  const pad=96, x0=L.cx-L.rx-pad, y0=L.topY-L.ry-130;
  const w=(L.rx+pad)*2, h=L.bodyH+L.ry*2+130+pad;
  const c=document.createElement('canvas');
  c.width=Math.ceil(w*DPR); c.height=Math.ceil(h*DPR);
  const g=c.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0); g.translate(-x0,-y0);
  const {cx,rx,ry,topY,bodyH}=L, botY=topY+bodyH;

  g.beginPath(); g.ellipse(cx,botY+ry*0.46,rx*1.24,ry*1.24,0,0,Math.PI*2);
  g.fillStyle='#FFEAF3'; g.fill(); outline(g,4);

  g.beginPath();
  g.moveTo(cx-rx,topY); g.lineTo(cx-rx,botY);
  g.ellipse(cx,botY,rx,ry,0,Math.PI,0,true);
  g.lineTo(cx+rx,topY); g.ellipse(cx,topY,rx,ry,0,0,Math.PI,false);
  g.closePath();
  const bg=g.createLinearGradient(cx-rx,0,cx+rx,0);
  bg.addColorStop(0,'#F6E2E9'); bg.addColorStop(.34,'#FFFFFF');
  bg.addColorStop(.62,'#FFF6FA'); bg.addColorStop(1,'#EFD3DE');
  g.fillStyle=bg; g.fill(); outline(g,4.5);

  const bandY=topY+bodyH*0.66, bandH=bodyH*0.28;
  g.save();
  g.beginPath();
  g.moveTo(cx-rx,topY); g.lineTo(cx-rx,botY);
  g.ellipse(cx,botY,rx,ry,0,Math.PI,0,true);
  g.lineTo(cx+rx,topY); g.ellipse(cx,topY,rx,ry,0,0,Math.PI,false);
  g.closePath(); g.clip();
  g.fillStyle=C.pinkL; g.fillRect(cx-rx,bandY,rx*2,bandH);
  g.strokeStyle='rgba(225,72,124,.55)'; g.lineWidth=3;
  for(let x=cx-rx;x<cx+rx;x+=16){ g.beginPath(); g.moveTo(x,bandY); g.lineTo(x,bandY+bandH); g.stroke(); }
  for(let y=bandY+6;y<bandY+bandH;y+=13){ g.beginPath(); g.moveTo(cx-rx,y); g.lineTo(cx+rx,y); g.stroke(); }
  g.restore();
  g.beginPath(); g.moveTo(cx-rx,bandY); g.lineTo(cx+rx,bandY); outline(g,3);
  g.beginPath(); g.moveTo(cx-rx,bandY+bandH); g.lineTo(cx+rx,bandY+bandH); outline(g,3);

  const bx=cx, by=bandY+bandH*0.5;
  [-1,1].forEach(s=>{
    g.beginPath(); g.moveTo(bx,by);
    g.bezierCurveTo(bx+s*26,by-22, bx+s*40,by-4, bx+s*22,by+11);
    g.bezierCurveTo(bx+s*14,by+16, bx+s*6,by+8, bx,by);
    g.closePath(); g.fillStyle=C.pinkD; g.fill(); outline(g,3.5);
  });
  g.beginPath(); g.ellipse(bx,by,8,7.5,0,0,Math.PI*2);
  g.fillStyle=C.pink; g.fill(); outline(g,3.5);

  g.beginPath(); g.ellipse(cx,topY,rx,ry,0,0,Math.PI*2);
  g.fillStyle='#FFFDFE'; g.fill(); outline(g,4.5);

  const SEG=44;
  const edge=i=>{ const a=Math.PI-Math.PI*i/SEG; return [cx+Math.cos(a)*rx, topY+Math.sin(a)*ry]; };
  const depth=i=>{ const u=i/SEG;
    return 9+(0.5+0.5*Math.sin(u*15.5+1.1))*9+(0.5+0.5*Math.sin(u*6.3+4.2))*7+fbm(u*9+3)*7; };
  g.beginPath();
  for(let i=0;i<=SEG;i++){ const[px,py]=edge(i); i?g.lineTo(px,py):g.moveTo(px,py); }
  for(let i=SEG;i>=0;i--){ const[px,py]=edge(i); g.lineTo(px,py+depth(i)); }
  g.closePath();
  const dg=g.createLinearGradient(0,topY-ry,0,topY+ry+46);
  dg.addColorStop(0,'#FFC9DE'); dg.addColorStop(.6,'#FBB0CC'); dg.addColorStop(1,'#F492B5');
  g.fillStyle=dg; g.fill(); outline(g,4);

  function berry(px,py,sc){
    g.save(); g.translate(px,py); g.scale(sc,sc);
    g.beginPath(); g.moveTo(0,15);
    g.bezierCurveTo(-13,7,-11,-9,0,-12);
    g.bezierCurveTo(11,-9,13,7,0,15);
    g.closePath(); g.fillStyle=C.straw; g.fill(); outline(g,3);
    g.fillStyle='rgba(255,255,255,.85)';
    for(const [sx,sy] of [[-4,0],[4,2],[0,7],[-5,7],[5,-5],[0,-5]]){
      g.beginPath(); g.ellipse(sx,sy,1.5,2,0,0,Math.PI*2); g.fill();
    }
    g.beginPath();
    for(let k=0;k<5;k++){
      const a=-Math.PI/2+k*Math.PI*2/5;
      g.ellipse(Math.cos(a)*5,-12+Math.sin(a)*3.4,5.5,3.2,a,0,Math.PI*2);
    }
    g.fillStyle=C.leaf; g.fill(); outline(g,2.6);
    g.restore();
  }
  berry(cx-rx*0.50,topY-ry*0.30,0.95);
  berry(cx+rx*0.48,topY-ry*0.16,0.88);
  berry(cx-rx*0.10,topY-ry*0.58,0.80);
  berry(cx+rx*0.16,topY+ry*0.02,0.74);

  L.cands.forEach(cd=>{
    const top=cd.base-cd.h;
    g.save();
    g.beginPath(); g.roundRect(cd.x-cd.w/2,top,cd.w,cd.h,[cd.w*.38,cd.w*.38,2,2]);
    g.fillStyle='#FFFFFF'; g.fill();
    g.save(); g.clip();
    g.strokeStyle=C.pink; g.lineWidth=5;
    for(let k=-2;k<9;k++){
      const y=top+k*11;
      g.beginPath(); g.moveTo(cd.x-cd.w,y); g.lineTo(cd.x+cd.w,y+cd.w*1.5); g.stroke();
    }
    g.restore();
    g.beginPath(); g.roundRect(cd.x-cd.w/2,top,cd.w,cd.h,[cd.w*.38,cd.w*.38,2,2]);
    outline(g,3.2);
    g.restore();
    g.beginPath(); g.moveTo(cd.x,top); g.lineTo(cd.x+0.8,top-6);
    g.strokeStyle=C.line; g.lineWidth=2.6; g.lineCap='round'; g.stroke();
  });
  return {c,x0,y0,w,h};
}

let candles=[],pops=[],confetti=[],balloons=[];
let wind=0,reveal=0,phase='intro',introFade=1,flash=0,dusk=0;
let raf=null,t0=performance.now(),started=false,hintTimer=null;

function buildBalloons(){
  balloons=[];
  for(let i=0;i<7;i++){
    balloons.push({x:(i%2? 0.845+hash(i*11.3)*0.13 : 0.025+hash(i*11.3)*0.13)*W, y:-60+hash(i*4.7)*(H*0.52+60),
      r:18+hash(i*8.1)*11, sp:0.14+hash(i*2.9)*0.16, ph:hash(i*6.6)*6.3,
      col:[C.pinkL,C.pink,C.blue,C.white][i%4]});
  }
}

function resizeCanvas(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.ceil(W*DPR); cv.height=Math.ceil(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#FDE3EC'); gr.addColorStop(1,'#F9BDD5');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  buildLayout();
}

/* 만드는 데 시간이 걸리는 것들 — 로딩 화면에서 한 단계씩 나눠 만든다 */
const BUILD=[
  ()=>{ buildSprites(); },
  ()=>{ skyDay=skySprite('#FDE3EC','#F9BDD5'); skyDusk=skySprite('#FBC6DD','#F09EC0'); },
  ()=>{ cloudSprite=buildClouds(); },
  ()=>{ cakeSprite=buildCake(); },
  ()=>{ garlandSprite=buildGarland(); giftSprite=buildGifts(); buildBalloons(); }
];

function resize(){
  if(!booted) return;
  resizeCanvas();
  BUILD.forEach(fn=>fn());
  if(candles.length!==L.cands.length) resetCandles();
}

function resetCandles(){
  candles=L.cands.map((_,i)=>({life:1,lit:true,tough:.80+((i*0.618)%1)*.50}));
  pops=[]; confetti=[];
}
function totalLight(){
  if(!candles.length) return 0;
  return candles.reduce((a,c)=>a+(c.lit?c.life:0),0)/candles.length;
}

function douse(i){
  const c=candles[i]; if(!c||!c.lit) return;
  c.lit=false; c.life=0; puff();
  const p=L.cands[i], ox=p.x, oy=p.base-p.h-8;
  for(let k=0;k<18;k++){
    const a=-Math.PI/2+(rnd()-0.5)*2.4, sp=1.6+rnd()*3.2;
    pops.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.2,
      kind:k%3===0?'star':'heart', ci:Math.floor(rnd()*6),
      s:11+rnd()*10, rot:rnd()*6.3, rs:(rnd()-0.5)*0.3, t:0, life:52+rnd()*30});
  }
  dusk=Math.min(1,dusk+1/Math.max(1,CONFIG.촛불개수));
  if(candles.every(x=>!x.lit)) finish();
}
function blow(power){
  candles.forEach((c,i)=>{ if(!c.lit) return; c.life-=power*0.021/c.tough; if(c.life<=0) douse(i); });
}
function recover(){
  candles.forEach(c=>{ if(c.lit&&c.life<1) c.life=Math.min(1,c.life+0.0035); });
}

function burstConfetti(){
  const cols=confSprites.cols;
  const add=(x,y,ang,spread,speed,n)=>{
    for(let i=0;i<n;i++){
      const a=ang+(rnd()-0.5)*spread, v=speed*(0.55+rnd()*0.75);
      const kind=['rect','rect','rect','heart','star','ribbon'][Math.floor(rnd()*6)];
      confetti.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,
        w:7+rnd()*9,h:10+rnd()*12, ci:Math.floor(rnd()*cols.length), kind,
        rot:rnd()*6.3, rs:(rnd()-0.5)*0.46, sway:rnd()*6.3, swaySp:0.03+rnd()*0.05,
        t:0, life:170+rnd()*130});
    }
  };
  add(-10,H*1.02,-Math.PI*0.34,0.55,21,95);
  add(W+10,H*1.02,-Math.PI*0.66,0.55,21,95);
  for(let i=0;i<90;i++) add(rnd()*W,-20-rnd()*160,Math.PI/2,0.9,2.2,1);
  fanfare();
}
function shade(hex){
  const n=parseInt(hex.slice(1),16), k=0.45;
  const mix=(a,b)=>Math.round(a*(1-k)+b*k);
  return `rgb(${mix(n>>16,201)},${mix((n>>8)&255,126)},${mix(n&255,150)})`;
}
function stepConfetti(){
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i]; p.t++;
    if(p.t>p.life||p.y>H+90){ confetti.splice(i,1); continue; }
    p.vy+=0.16; p.vx*=0.985; p.vy*=0.988;
    p.sway+=p.swaySp;
    p.x+=p.vx+Math.sin(p.sway)*0.9; p.y+=p.vy; p.rot+=p.rs;
  }
}
function drawConfetti(g){
  const cols=confSprites.cols;
  for(const p of confetti){
    const fade=p.t>p.life-40?(p.life-p.t)/40:1;
    const c=Math.cos(p.rot), wsc=Math.abs(c);
    g.globalAlpha=Math.max(0,fade);
    if(p.kind==='rect'){
      g.fillStyle=c>0?cols[p.ci]:shade(cols[p.ci]);
      g.fillRect(p.x-p.w*wsc/2,p.y-p.h/2,Math.max(1,p.w*wsc),p.h);
    } else {
      const sp=confSprites[p.kind][p.ci], s=p.w*1.9;
      g.drawImage(sp,p.x-s*wsc/2,p.y-s/2,Math.max(1,s*wsc),s);
    }
  }
  g.globalAlpha=1;
}
function stepPops(){
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t++;
    if(p.t>p.life){ pops.splice(i,1); continue; }
    p.vy+=0.13; p.vx*=0.98; p.vy*=0.99;
    p.x+=p.vx; p.y+=p.vy; p.rot+=p.rs;
  }
}
function drawPops(g){
  for(const p of pops){
    const u=p.t/p.life, wsc=Math.abs(Math.cos(p.rot));
    g.globalAlpha=Math.max(0,1-u*u);
    g.drawImage(confSprites[p.kind][p.ci],p.x-p.s*wsc/2,p.y-p.s/2,Math.max(1,p.s*wsc),p.s);
  }
  g.globalAlpha=1;
}

function flamePts(bx,by,h,w,bend,time,seed){
  const N=26, left=[], right=[];
  for(let i=0;i<N;i++){
    const u=i/(N-1);
    const half=w*Math.pow(1-u,0.85)*Math.pow(u,0.30)/0.51;
    const sway=(fbm(seed+time*2.6+u*2.4)-.5)*4*Math.pow(u,1.4);
    const px=bx+sway+bend*u*u, py=by-u*h;
    left.push([px-half,py]); right.push([px+half,py]);
  }
  return left.concat(right.reverse());
}
function flameShape(g,pts,fill,stroke,lw){
  g.beginPath();
  pts.forEach(([x,y],i)=> i?g.lineTo(x,y):g.moveTo(x,y));
  g.closePath();
  g.fillStyle=fill; g.fill();
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=lw; g.lineJoin='round'; g.stroke(); }
}

function drawFlame(g,cd,st,time,seed){
  const life=st.life;
  const h=cd.h*0.62*(0.45+0.55*life), w=cd.w*0.88*(0.58+0.42*life);
  const bx=cd.x, by=cd.base-cd.h-3, bend=wind*32;

  // 번짐 — 따뜻한 기운
  g.globalCompositeOperation='lighter';
  const bl=96*(0.4+0.6*life);
  g.globalAlpha=0.55*life;
  g.drawImage(blobMid,bx-bl/2+bend*0.4,by-h*0.45-bl/2,bl,bl);
  g.globalAlpha=1;
  g.globalCompositeOperation='source-over';

  // 또렷한 세 겹 — 배경이 밝아도 형태가 살아있다
  flameShape(g, flamePts(bx,by,h,w,bend,time,seed),        '#FF9526', 'rgba(94,51,46,.55)', 2.4);
  flameShape(g, flamePts(bx,by,h*0.72,w*0.62,bend,time,seed+9), '#FFC63F', null, 0);
  flameShape(g, flamePts(bx,by,h*0.40,w*0.34,bend,time,seed+19),'#FFF3C4', null, 0);
}

function render(now){
  const time=(now-t0)/1000;
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(skyDay,0,0,W,H);
  if(dusk>0.001){ ctx.globalAlpha=dusk*0.85; ctx.drawImage(skyDusk,0,0,W,H); ctx.globalAlpha=1; }

  const drift=(time*7)%W;
  ctx.globalAlpha=0.85;
  ctx.drawImage(cloudSprite,-drift,0,W,H);
  ctx.drawImage(cloudSprite,W-drift,0,W,H);
  ctx.globalAlpha=1;

  if(garlandSprite) ctx.drawImage(garlandSprite.c,0,garlandSprite.y0,W,garlandSprite.h);

  for(const b of balloons){
    b.y-=b.sp; if(b.y<-70) b.y=H*0.52;
    const bx=b.x+Math.sin(time*0.6+b.ph)*14;
    ctx.strokeStyle='rgba(94,51,46,.35)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(bx,b.y+b.r*1.15);
    ctx.quadraticCurveTo(bx+7,b.y+b.r*2.1,bx-3,b.y+b.r*2.9); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(bx,b.y,b.r*0.84,b.r,0,0,Math.PI*2);
    ctx.fillStyle=b.col; ctx.fill();
    ctx.strokeStyle=C.line; ctx.lineWidth=2.6; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(bx-b.r*0.28,b.y-b.r*0.34,b.r*0.19,b.r*0.26,-0.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.fill();
  }

  if(reveal>0.001&&cakeSprite){
    ctx.globalAlpha=reveal;
    ctx.drawImage(cakeSprite.c,cakeSprite.x0,cakeSprite.y0,cakeSprite.w,cakeSprite.h);
    ctx.globalAlpha=1;
  }

  if(L&&phase!=='intro'){
    const lit=totalLight();
    if(lit>0.02){
      ctx.globalCompositeOperation='lighter';
      for(let i=0;i<10;i++){
        const a=time*0.7+i*0.63, rr=L.rx*(1.05+0.2*Math.sin(time*1.3+i));
        const sx=L.cx+Math.cos(a)*rr, sy=L.topY-24+Math.sin(a*1.4)*30;
        const tw=(0.5+0.5*Math.sin(time*3.4+i*2.1))*lit, s=18+tw*16;
        ctx.globalAlpha=tw*0.75;
        ctx.drawImage(sparkSprite,sx-s/2,sy-s/2,s,s);
      }
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
  }

  if(introFade>0.01&&giftSprite){
    ctx.globalAlpha=introFade;
    ctx.drawImage(giftSprite.c,0,giftSprite.y0,W,giftSprite.h);
    ctx.globalAlpha=1;
  }
  if(L&&phase!=='intro'){
    L.cands.forEach((cd,i)=>{
      const st=candles[i];
      if(st&&st.lit&&st.life>0.01) drawFlame(ctx,cd,st,time,i*17.3+1.7);
    });
  }

  stepPops(); drawPops(ctx);
  stepConfetti(); drawConfetti(ctx);

  if(flash>0.001){ ctx.fillStyle=`rgba(255,255,255,${flash})`; ctx.fillRect(0,0,W,H); flash*=0.90; }

  if(phase!=='intro'&&introFade>0) introFade=Math.max(0,introFade-0.022);
  if(phase==='cake'&&reveal<1) reveal=Math.min(1,reveal+0.02);
  if((phase==='party'||phase==='letter')&&reveal>0.32) reveal=Math.max(0.32,reveal-0.004);

  raf=requestAnimationFrame(render);
}

/* ── 마이크 ── */
let audioCtx=null,analyser=null,freq=null,timeBuf=null;
let micOn=false,micRaf=null,blowHold=0;
let baseline=0,primed=0,blowing=false,songBus=null,ducked=false,stuck=0,armAt=0;
const DEBUG=/[?&]debug/.test(location.search);

async function openMic(){
  try{
    let stream;
    try{
      stream=await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});
    }catch(_){ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
    const src=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048; analyser.smoothingTimeConstant=0.3;
    src.connect(analyser);
    freq=new Uint8Array(analyser.frequencyBinCount);
    timeBuf=new Uint8Array(analyser.fftSize);
    micOn=true;
    $('micDot').dataset.on='1';
    $('micNote').textContent='주변 소리 맞추는 중…';
  }catch(e){
    micOn=false;
    $('promptMain').textContent='촛불을 눌러서 꺼줘';
    $('sub').textContent='마이크 없이도 괜찮아';
    $('micNote').textContent='마이크를 못 써서 터치로 진행돼';
    document.querySelector('.meter').style.display='none';
  }
}
/* 세기와 '숨다움'을 함께 읽는다.
   숨은 모든 주파수에 고르게 퍼진 잡음이고, 노래는 몇 개의 봉우리에만 몰려 있다.
   그 고른 정도(스펙트럼 평탄도)를 재면 둘을 확실히 가를 수 있다. */
function readMic(){
  analyser.getByteTimeDomainData(timeBuf);
  let sum=0;
  for(let i=0;i<timeBuf.length;i++){ const v=(timeBuf[i]-128)/128; sum+=v*v; }
  const rms=Math.sqrt(sum/timeBuf.length);

  analyser.getByteFrequencyData(freq);
  const hz=audioCtx.sampleRate/analyser.fftSize;

  const a=Math.max(1,Math.round(40/hz)), b=Math.round(600/hz);
  let low=0,n=0;
  for(let i=a;i<=b&&i<freq.length;i++){ low+=freq[i]; n++; }
  low=n?low/n/255:0;

  const i0=Math.max(1,Math.round(250/hz)), i1=Math.min(freq.length-1,Math.round(6000/hz));
  let sl=0,su=0,m=0;
  for(let i=i0;i<=i1;i++){ const v=freq[i]/255+1e-4; sl+=Math.log(v); su+=v; m++; }
  const flat = m ? Math.exp(sl/m)/(su/m) : 0;

  return { lvl: Math.max(rms*1.7, low), flat };
}

function micLoop(){
  const m=readMic(), lvl=m.lvl, flat=m.flat, S=Math.max(0.4,CONFIG.감도||1);
  const FT=CONFIG.숨구분||0.28;
  const breathy=Math.max(0,Math.min(1,(flat-FT*0.75)/(FT*0.55)));   // 0이면 음악, 1이면 숨
  if(primed<48){
    primed++;
    baseline=(primed===1)?lvl:Math.max(lvl, baseline*0.997);
    $('micNote').textContent='주변 소리 맞추는 중…';
    if(DEBUG) dbg(lvl,0,0,flat);
    micRaf=requestAnimationFrame(micLoop); return;
  }
  if(primed===48){
    primed=49;
    armAt=performance.now()+900;          // 켜자마자 꺼지는 사고를 막는 유예
    $('micNote').textContent='준비됐어';
    setTimeout(()=>{ $('micNote').textContent=''; },1500);
  }
  const gate=baseline*1.05+0.022/S;
  const rawL=Math.max(0,Math.min(1,(lvl-gate)/(0.09/S)));
  const raw=rawL*breathy;                       // 숨다울 때만 힘이 실린다
  if(raw>0.02) blowHold++; else blowHold=Math.max(0,blowHold-6);
  blowing=blowHold>=5;
  if(blowing&&!ducked&&songBus){
    ducked=true;
    try{
      songBus.gain.cancelScheduledValues(audioCtx.currentTime);
      songBus.gain.setValueAtTime(songBus.gain.value,audioCtx.currentTime);
      songBus.gain.linearRampToValueAtTime(0.10,audioCtx.currentTime+0.35);
    }catch(e){}
  }
  /* 기준선은 멈추지 않되 속도를 셋으로 나눈다.
     내려갈 때는 빠르게, 평소 올라갈 때는 느리게,
     숨이 잡혀 있는 동안에는 아주 느리게 — 약한 숨이 스스로를 지우지 않도록. */
  const up = blowHold>0 ? 0.0015 : 0.010;
  baseline += (lvl-baseline) * (lvl>baseline ? up : 0.10);
  stuck = blowHold>0 ? stuck+1 : 0;
  if (stuck>110){ baseline=lvl; blowHold=0; stuck=0; }
  if(blowing){
    const ramp=Math.min(1,Math.max(0,(blowHold-5)/24));
    wind=wind*0.55+Math.max(0.35,raw)*0.45;
    if (performance.now()>armAt) blow((0.30+0.70*raw)*(0.30+1.75*ramp)*S);
  } else { wind*=0.8; recover(); }
  $('meterFill').style.width=Math.round(Math.max(raw,Math.min(1,lvl/(gate+0.09)))*100)+'%';
  if(DEBUG) dbg(lvl,gate,raw,flat);
  micRaf=requestAnimationFrame(micLoop);
}
let dbgEl=null,dbgN=0;
function dbg(lvl,gate,raw,flat){
  if(!dbgEl){
    dbgEl=document.createElement('div');
    dbgEl.style.cssText='position:fixed;left:8px;top:8px;z-index:9;font:11px/1.6 monospace;color:#B1275F;background:rgba(255,255,255,.85);padding:7px 9px;border-radius:8px;white-space:pre;pointer-events:none';
    document.body.appendChild(dbgEl);
  }
  if(++dbgN%6) return;
  dbgEl.textContent='lvl   '+lvl.toFixed(3)+'\nbase  '+baseline.toFixed(3)+'\ngate  '+gate.toFixed(3)
    +'\nflat  '+(flat||0).toFixed(3)+(flat>=(CONFIG.숨구분||0.28)?'  숨':'  음악')
    +'\nraw   '+raw.toFixed(2)+'\nhold  '+blowHold+(blowing?'  ● 부는 중':'');
}

/* ── 소리 ── */
let reverb=null;
function makeReverb(){
  const sr=audioCtx.sampleRate, len=Math.floor(sr*1.9);
  const buf=audioCtx.createBuffer(2,len,sr);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++){ const t=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-t,2.6)*0.6; }
  }
  const conv=audioCtx.createConvolver(); conv.buffer=buf;
  const wet=audioCtx.createGain(); wet.gain.value=0.30;
  conv.connect(wet).connect(audioCtx.destination);
  return conv;
}
function bell(freq,at,dur,gain,pan){
  const dest=songBus||audioCtx.destination;
  const out=audioCtx.createGain();
  const p=audioCtx.createStereoPanner?audioCtx.createStereoPanner():null;
  if(p){ p.pan.value=pan||0; out.connect(p); p.connect(dest); if(reverb) p.connect(reverb); }
  else { out.connect(dest); if(reverb) out.connect(reverb); }
  [[1,1],[2,.34],[3,.14],[4.2,.06],[5.4,.03]].forEach(([m,a])=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq*m;
    const amp=Math.max(0.0002,gain*a), len=dur/(1+(m-1)*0.35);
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(amp,at+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,at+len);
    o.connect(g).connect(out);
    o.start(at); o.stop(at+len+0.05);
  });
}
function bass(freq,at,dur,gain){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value=520;
  o.type='triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,at);
  g.gain.linearRampToValueAtTime(gain,at+0.05);
  g.gain.setValueAtTime(gain,at+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(f).connect(g).connect(songBus||audioCtx.destination);
  o.start(at); o.stop(at+dur+0.05);
}
function pad(freqs,at,dur,gain){
  freqs.forEach((fr,i)=>{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.value=fr; o.detune.value=(i-1)*4;
    g.gain.setValueAtTime(0.0001,at);
    g.gain.linearRampToValueAtTime(gain,at+0.28);
    g.gain.setValueAtTime(gain,at+dur*0.72);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g).connect(songBus||audioCtx.destination);
    if(reverb) g.connect(reverb);
    o.start(at); o.stop(at+dur+0.05);
  });
}
function puff(){
  if(!audioCtx) return;
  const dur=0.34, sr=audioCtx.sampleRate;
  const buf=audioCtx.createBuffer(1,Math.floor(sr*dur),sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const t=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-t,2.4); }
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=760; bp.Q.value=0.7;
  const g=audioCtx.createGain(); g.gain.value=0.30;
  src.connect(bp).connect(g).connect(audioCtx.destination);
  src.start();
}
function pop(at,pan){
  const sr=audioCtx.sampleRate, dur=0.22;
  const buf=audioCtx.createBuffer(1,Math.floor(sr*dur),sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){ const t=i/d.length; d[i]=(Math.random()*2-1)*Math.pow(1-t,5); }
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=0.6;
  const g=audioCtx.createGain(); g.gain.value=0.55;
  const p=audioCtx.createStereoPanner?audioCtx.createStereoPanner():null;
  if(p){ src.connect(bp).connect(g).connect(p); p.pan.value=pan; p.connect(audioCtx.destination); if(reverb) p.connect(reverb); }
  else src.connect(bp).connect(g).connect(audioCtx.destination);
  src.start(at);
}
function fanfare(){
  if(!audioCtx) return;
  const t=audioCtx.currentTime;
  pop(t,-0.6); pop(t+0.09,0.6);
  const N={C5:523.25,E5:659.25,G5:783.99,C6:1046.5,E6:1318.5,G6:1568,C7:2093};
  [[N.C5,0],[N.E5,.07],[N.G5,.14],[N.C6,.21],[N.E6,.30],[N.G6,.40],[N.C7,.52]]
    .forEach(([f,d],i)=>bell(f,t+0.12+d,1.5,0.13,(i%2?0.35:-0.35)));
  const sr=audioCtx.sampleRate, dur=1.6;
  const buf=audioCtx.createBuffer(1,Math.floor(sr*dur),sr);
  const d2=buf.getChannelData(0);
  for(let i=0;i<d2.length;i++){ const u=i/d2.length; d2[i]=(Math.random()*2-1)*Math.pow(1-u,2.2)*0.5; }
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const hp=audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=4200;
  const g=audioCtx.createGain(); g.gain.value=0.22;
  src.connect(hp).connect(g).connect(audioCtx.destination);
  if(reverb) g.connect(reverb);
  src.start(t+0.1);
}
function playSong(){
  if(!CONFIG.노래재생||!audioCtx) return;
  songBus=audioCtx.createGain(); songBus.gain.value=0.58;
  songBus.connect(audioCtx.destination);
  ducked=false;
  const N={G3:196,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,B3:246.94,B4:493.88,
           C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,C6:1046.5};
  const beat=0.46, t=audioCtx.currentTime+0.5, B=n=>t+n*beat;
  [[N.C5,0],[N.E5,.5],[N.G5,1],[N.C6,1.5],[N.G5,2],[N.E5,2.5]]
    .forEach(([f,b],i)=>bell(f,B(b),1.4,0.10,(i%2?0.3:-0.3)));
  const OFF=4;
  [[N.G4,0,.5],[N.G4,.5,.5],[N.A4,1,1],[N.G4,2,1],[N.C5,3,1],[N.B4,4,2],
   [N.G4,6,.5],[N.G4,6.5,.5],[N.A4,7,1],[N.G4,8,1],[N.D5,9,1],[N.C5,10,2],
   [N.G4,12,.5],[N.G4,12.5,.5],[N.G5,13,1],[N.E5,14,1],[N.C5,15,1],[N.B4,16,1],[N.A4,17,1.5],
   [N.F5,19,.5],[N.F5,19.5,.5],[N.E5,20,1],[N.C5,21,1],[N.D5,22,1],[N.C5,23,2.5]]
   .forEach(([f,b,d])=>bell(f,B(b+OFF),Math.max(0.8,d*beat*2.0),0.17,0));
  [[0,[N.C4,N.E4,N.G4],3,N.C4/2],[3,[N.G3,N.B3,N.D4],3,N.G3],
   [6,[N.G3,N.B3,N.D4],3,N.G3],[9,[N.C4,N.E4,N.G4],3,N.C4/2],
   [12,[N.C4,N.E4,N.G4],3,N.C4/2],[15,[N.F4,N.A4,N.C5],3,N.F4/2],
   [18,[N.F4,N.A4,N.C5],3,N.F4/2],[21,[N.C4,N.E4,N.G4],2,N.C4/2],
   [23,[N.G3,N.B3,N.D4],1.5,N.G3],[24.5,[N.C4,N.E4,N.G4],3,N.C4/2]]
  .forEach(([b,fs,d,bs])=>{ pad(fs,B(b+OFF),d*beat,0.035); bass(bs,B(b+OFF),d*beat,0.10); });
}

/* ── 흐름 ── */
$('openTitle').textContent=`${CONFIG.호칭}, 생일 축하해`;
$('ribbon').textContent=`To. ${CONFIG.호칭}`;
CONFIG.편지.forEach((line,i)=>{
  const p=document.createElement('p');
  p.textContent=line; p.style.animationDelay=(0.5+i*0.55)+'s';
  $('letterBody').appendChild(p);
});
$('sign').textContent=CONFIG.서명;
$('sign').style.animationDelay=(0.5+CONFIG.편지.length*0.55+0.4)+'s';

function show(id){ ['s0','s1','s2','s3'].forEach(s=>$(s).dataset.on=(s===id)?'1':'0'); }

function finish(){
  clearTimeout(hintTimer);
  if(micRaf) cancelAnimationFrame(micRaf);
  wind=0; phase='party';
  $('prompt').style.opacity='0';
  flash=0.95;
  setTimeout(burstConfetti,180);
  setTimeout(()=>{ phase='letter'; show('s3'); },2200);
}

async function start(){
  if(started) return;
  started=true;
  phase='cake'; resetCandles(); reveal=0; dusk=0;
  show('s2');
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  await openMic();
  if(audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(e){} }
  try{ reverb=makeReverb(); }catch(e){ reverb=null; }
  playSong();
  if(micOn) setTimeout(micLoop, 3200);
  hintTimer=setTimeout(()=>{
    if(candles.some(c=>c.lit)&&micOn) $('sub').textContent='잘 안 되면 촛불을 톡 눌러도 돼';
  },9000);
}

$('startBtn').addEventListener('click',e=>{ e.stopPropagation(); start(); });
$('s1').addEventListener('click',start);
$('s1').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); start(); } });

cv.addEventListener('click',e=>{
  if(phase!=='cake'||!L) return;
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=-1,bd=46;
  L.cands.forEach((c,i)=>{
    const d=Math.hypot(mx-c.x,my-(c.base-c.h*0.6));
    if(d<bd&&candles[i]&&candles[i].lit){ bd=d; best=i; }
  });
  if(best>=0) douse(best);
});

$('again').addEventListener('click',()=>{
  clearTimeout(hintTimer);
  resetCandles();
  baseline=0; primed=0; blowHold=0; blowing=false; stuck=0; armAt=0;
  phase='cake'; reveal=1; dusk=0; flash=0;
  $('prompt').style.opacity='1';
  $('sub').textContent=micOn?'폰에 대고 천천히':'마이크 없이도 괜찮아';
  show('s2');
  playSong();
  if(micOn){ if(micRaf) cancelAnimationFrame(micRaf); setTimeout(micLoop,3200); }
  hintTimer=setTimeout(()=>{
    if(candles.some(c=>c.lit)&&micOn) $('sub').textContent='잘 안 되면 촛불을 톡 눌러도 돼';
  },9000);
});

window.addEventListener('resize',resize);

/* ── 준비가 다 될 때까지 기다렸다가 시작한다 ── */
let booted=false, prog=0, progTarget=0, spritesDone=false, fontsDone=false;
const bootAt=performance.now();

let workProg=0;
function setProg(v){ workProg=Math.max(workProg,Math.min(1,v)); }
function paintProg(){
  /* 막대는 '실제 진행'과 '흐른 시간' 중 느린 쪽을 따른다.
     그래야 앞서 달리지도, 멈춰 서 있지도 않는다. */
  const timeP=Math.min(1,(performance.now()-bootAt)/1500);
  progTarget=Math.min(workProg,timeP);
  prog += (progTarget-prog)*0.16;
  const pc=Math.round(prog*100);
  $('barFill').style.width = pc+'%';
  $('barBow').style.left   = pc+'%';
  $('pct').textContent     = pc+'%';
}

function boot(){
  resizeCanvas();
  setProg(0.10);

  let i=0;
  const step=()=>{
    paintProg();
    if(i<BUILD.length){
      BUILD[i](); i++;
      setProg(0.10+0.62*(i/BUILD.length));
      requestAnimationFrame(()=>requestAnimationFrame(step));   // 한 프레임 쉬어 막대가 움직이게
    } else {
      resetCandles();
      spritesDone=true;
      finishBoot();
    }
  };
  requestAnimationFrame(step);

  const fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  let settled=false;
  const markFonts=()=>{ if(settled) return; settled=true; fontsDone=true; setProg(0.94); finishBoot(); };
  fonts.then(markFonts);
  setTimeout(markFonts, 4000);        // 글꼴이 끝내 안 와도 4초 뒤엔 진행한다
}

function finishBoot(){
  if(booted) return;
  const waited = performance.now()-bootAt;
  if(!(spritesDone && fontsDone)){ requestAnimationFrame(()=>{ paintProg(); }); return; }
  if(waited < 1500){ setTimeout(finishBoot, 1520-waited); return; }

  setProg(1);
  const settle=()=>{
    paintProg();
    if(prog<0.995){ requestAnimationFrame(settle); return; }
    booted=true;
    show('s1');
    render(performance.now());
  };
  requestAnimationFrame(settle);
}

/* 로딩 동안에도 막대가 부드럽게 움직이도록 */
(function tick(){ if(!booted){ paintProg(); requestAnimationFrame(tick); } })();

boot();
</script>
